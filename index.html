<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Lesson For My Habibi</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 220, 200, 0.22) 0%, transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(170, 190, 255, 0.16) 0%, transparent 26%),
        linear-gradient(135deg, #07111f, #101c31 45%, #1c1824);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #231f20;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    #intro {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(255, 210, 220, 0.28), transparent 38%),
        linear-gradient(135deg, #07111f, #101c31 45%, #1c1824);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: introFade 3s ease forwards;
    }

    .intro-heart {
      font-size: 95px;
      animation: heartPop 1.2s ease;
    }

    .intro-text {
      margin-top: 18px;
      color: #fff8f2;
      font-size: 25px;
      font-weight: 800;
      text-align: center;
      padding: 0 24px;
    }

    @keyframes heartPop {
      0% { transform: scale(0.3); opacity: 0; }
      55% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes introFade {
      0% { opacity: 1; visibility: visible; }
      70% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }

    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .floaty {
      position: absolute;
      bottom: -80px;
      opacity: 0;
      animation-name: rise;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.2));
    }

    @keyframes rise {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      12% { opacity: 0.35; }
      85% { opacity: 0.28; }
      100% { transform: translateY(-120vh) rotate(10deg); opacity: 0; }
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 248, 242, 0.97);
      border-radius: 30px;
      padding: 32px 26px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      text-align: center;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(10px);
      animation: cardIn 0.9s ease 2.5s both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .tag {
      display: inline-block;
      padding: 10px 17px;
      border-radius: 999px;
      background: #ead2c4;
      color: #6d4638;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .tag span {
      font-size: 16px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 22px;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 500;
      color: #76645d;
    }

    #fact {
      font-size: 24px;
      line-height: 1.42;
      font-weight: 800;
      margin: 0 0 24px;
      color: #231f20;
    }

    button {
      border: none;
      background: #231f20;
      color: white;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      transition: 0.2s ease;
    }

    button:hover {
      transform: scale(1.02);
      opacity: 0.92;
    }

    .note {
      font-size: 13px;
      color: #8b7770;
      margin-top: 24px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div id="intro">
    <div class="intro-heart">❤️</div>
    <div class="intro-text">Good morning, my love</div>
  </div>

  <div class="sky" id="sky"></div>

  <main class="card">
    <div class="tag">Daily lesson for my <span>habibi</span></div>

    <h1>Here is something you should know, my dear potential husband</h1>

    <p id="fact"></p>

    <button onclick="showRandomFact()">Show another one</button>

    <p class="note">Updated daily with love, so proud of you!</p>
  </main>

  <script>
    const emojis = ["❤️", "🥰", "😍", "💋", "😘", "⭐️", "🌙"];
    const sky = document.getElementById("sky");

    const lanes = [4, 12, 20, 28, 36, 44, 52, 60, 68, 76, 84, 92];

    for (let i = 0; i < 36; i++) {
      const span = document.createElement("span");
      span.className = "floaty";
      span.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];

      const lane = lanes[i % lanes.length];
      const smallOffset = Math.random() * 3 - 1.5;

      span.style.left = (lane + smallOffset) + "%";
      span.style.fontSize = (15 + Math.random() * 12) + "px";
      span.style.animationDuration = (12 + Math.random() * 10) + "s";
      span.style.animationDelay = (i * 0.55) + "s";

      sky.appendChild(span);
    }

    const facts = [
      "Hermès Birkin = more casual luxury handbag. Kelly = more structured and elegant. Kelly is often seen as more formal.",
      "A tuxedo is for black-tie events. Satin lapels, usually worn with a bow tie. A normal suit is for business or formal daily wear.",
      "“Smoking” in Europe can mean tuxedo. French pronunciation: “smo-king.”",
      "The outermost fork is used first during formal dining.",
      "Never button the bottom button of a suit jacket.",
      "Shoes should always be darker than trousers in formalwear.",
      "A wrinkled shirt destroys an expensive outfit instantly.",
      "Brunello Cucinelli represents understated wealth, not flashy fashion.",
      "Loud designer logos are often associated with new money, not old money.",
      "In luxury settings, calmness matters more than dominance.",
      "Don’t chew gum while speaking in business settings.",
      "Keep fingernails short and clean. People notice hands more than men think.",
      "Cologne should be discovered, not announced.",
      "If a waiter pours water, stop touching the glass.",
      "At formal dinners, place napkin on chair if temporarily leaving the table.",
      "Place napkin on the table only when fully finished.",
      "Never start eating before everyone is served.",
      "Bread plate sits on the left. Drinks on the right.",
      "If unsure which glass is yours, remember: BMW = Bread, Meal, Water from left to right.",
      "Don’t wear square-toe dress shoes. They are considered outdated.",
      "Brown shoes are less formal than black shoes.",
      "Patent leather shoes are mainly for tuxedos.",
      "Never wear a backpack with a tuxedo.",
      "Iron your collar properly. People notice collar folds immediately.",
      "A watch should slide under a shirt cuff easily.",
      "In business dinners, avoid ordering the most expensive item.",
      "Don’t discuss politics aggressively at mixed dinners.",
      "Never place elbows fully on the dining table while eating.",
      "Espresso is usually drunk quickly, not slowly for one hour.",
      "Cappuccino after dinner in Italy is considered tourist behavior.",
      "Sommelier = wine expert. Pronounced: so-mel-yay.",
      "À la carte means ordering individual dishes instead of a set menu.",
      "RSVP comes from French: Répondez s’il vous plaît. Means please respond.",
      "If someone important enters a room, stand up to greet them.",
      "Don’t interrupt introductions with jokes.",
      "Eye contact should feel calm, not aggressive.",
      "In luxury hotels, staff remember respectful guests more than rich guests.",
      "Don’t snap fingers to call staff.",
      "Say thank you using the staff member’s name if visible.",
      "In business, arriving 10 minutes early is punctual. Arriving 30 minutes early creates pressure.",
      "If hosting dinner, wait until guests begin ordering before ordering yourself.",
      "Never stack plates at a fine restaurant to help.",
      "Don’t blow on hot soup loudly.",
      "Stir coffee quietly without hitting the cup.",
      "Don’t leave sunglasses on indoors during conversations.",
      "If wearing loafers casually, ankles can show slightly. If formal, use proper socks.",
      "White undershirts should never be visible under dress shirts.",
      "Black tie means tuxedo. Formal does not always mean tuxedo.",
      "Dinner jacket = tuxedo jacket.",
      "Peak lapels are more formal than notch lapels.",
      "Double-breasted suits should usually stay buttoned while standing.",
      "Never wear a clip-on tie in serious business environments.",
      "Tie tip should end near the belt buckle.",
      "Cheap belts crack quickly. Good leather ages well.",
      "Matching belt and shoe colors creates a cleaner appearance.",
      "Suede shoes are less formal but very elegant when styled correctly.",
      "Loro Piana is famous for elite cashmere and extremely soft fabrics.",
      "Sprezzatura = intentional effortless elegance.",
      "Don’t over-explain your achievements. High-status people usually speak less about money.",
      "In Swiss-style business culture, reliability matters more than charisma.",
      "Don’t ask someone how much do you make.",
      "Avoid talking loudly on speakerphone in public.",
      "Keep shoes clean. Dirty shoes ruin credibility instantly.",
      "When sitting in a suit, unbutton the jacket.",
      "When standing up again, rebutton it.",
      "Never wear sports socks with dress shoes.",
      "Tailoring matters more than brand name.",
      "Expensive clothing with poor fit still looks cheap.",
      "A dinner invitation at someone’s home usually deserves a follow-up thank-you message.",
      "Flowers are appropriate for birthdays, congratulations, apologies, hospital visits, and dinner invitations.",
      "Red roses often imply romance specifically.",
      "White lilies are associated with funerals in many cultures.",
      "Learn basic wine knowledge even if you don’t drink.",
      "Champagne is poured gently to preserve bubbles.",
      "In formal hosting, women and elders are usually served first.",
      "Hold champagne glasses by the stem, not the bowl.",
      "Don’t spin wine dramatically unless actually tasting professionally.",
      "Business cards should be handed cleanly, not pulled from a messy wallet.",
      "Never place a thick wallet in a suit pocket. It ruins the silhouette.",
      "In Arab culture, hospitality is strongly connected to dignity and generosity.",
      "In Gulf meetings, small talk before business is normal and important.",
      "Old money style focuses on quality, fit, and discretion.",
      "New money style is often associated with loud logos and trend-chasing.",
      "A gentleman never embarrasses his partner publicly, even jokingly.",
      "Correct people privately, praise publicly.",
      "Learn how to pronounce luxury names correctly. It signals exposure and education.",
      "Bottega Veneta = Bot-teh-ga Ve-ne-ta.",
      "Givenchy = Zhee-von-shee.",
      "Louis Vuitton = Loo-ee Vwee-ton.",
      "Goyard = Goy-yar.",
      "Cartier = Car-tee-ay.",
      "A quality pen still matters in executive settings.",
      "Don’t over-accessorize. One watch and maybe one ring is enough.",
      "Silence is not awkward when confidence is real.",
      "Don’t laugh excessively loudly in elegant environments.",
      "Learn table pacing. Don’t finish every course far before everyone else.",
      "If your partner is speaking to someone, don’t interrupt to dominate conversation.",
      "Elegant people make others feel comfortable, not intimidated.",
      "Never mock staff, accents, or someone’s lack of knowledge publicly.",
      "Real sophistication is making people feel respected without trying to look superior."
    ];

    function getDailyIndex() {
      const start = new Date(new Date().getFullYear(), 0, 0);
      const today = new Date();
      const diff = today - start;
      const oneDay = 1000 * 60 * 60 * 24;
      return Math.floor(diff / oneDay) % facts.length;
    }

    function showDailyFact() {
      document.getElementById("fact").innerText = facts[getDailyIndex()];
    }

    function showRandomFact() {
      const randomIndex = Math.floor(Math.random() * facts.length);
      document.getElementById("fact").innerText = facts[randomIndex];
    }

    showDailyFact();

    setTimeout(() => {
      const intro = document.getElementById("intro");
      if (intro) {
        intro.style.display = "none";
      }
    }, 3000);
  </script>

</body>
</html>
