<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Lesson For My Habibi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 220, 200, 0.22) 0%, transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(170, 190, 255, 0.16) 0%, transparent 26%),
        linear-gradient(135deg, #07111f, #101c31 45%, #1c1824);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #231f20;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    #intro {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(255, 210, 220, 0.28), transparent 38%),
        linear-gradient(135deg, #07111f, #101c31 45%, #1c1824);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: introFade 3s ease forwards;
    }

    .intro-heart {
      font-size: 110px;
      animation: heartPop 1.2s ease;
      filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.3));
    }

    .intro-text {
      margin-top: 18px;
      color: #fff8f2;
      font-size: 25px;
      font-weight: 800;
      text-align: center;
      padding: 0 24px;
    }

    @keyframes heartPop {
      0% {
        transform: scale(0.3);
        opacity: 0;
      }
      55% {
        transform: scale(1.15);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes introFade {
      0% {
        opacity: 1;
        visibility: visible;
      }
      70% {
        opacity: 1;
        visibility: visible;
      }
      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .floaty {
      position: absolute;
      bottom: -70px;
      opacity: 0;
      animation-name: rise;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.2));
    }

    .floaty:nth-child(1) { left: 3%; animation-duration: 10s; animation-delay: 0s; font-size: 18px; }
    .floaty:nth-child(2) { left: 9%; animation-duration: 13s; animation-delay: 2s; font-size: 24px; }
    .floaty:nth-child(3) { left: 15%; animation-duration: 11s; animation-delay: 4s; font-size: 16px; }
    .floaty:nth-child(4) { left: 21%; animation-duration: 15s; animation-delay: 1s; font-size: 22px; }
    .floaty:nth-child(5) { left: 27%; animation-duration: 12s; animation-delay: 3s; font-size: 19px; }
    .floaty:nth-child(6) { left: 33%; animation-duration: 16s; animation-delay: 5s; font-size: 25px; }
    .floaty:nth-child(7) { left: 39%; animation-duration: 10s; animation-delay: 6s; font-size: 17px; }
    .floaty:nth-child(8) { left: 45%; animation-duration: 14s; animation-delay: 1.5s; font-size: 23px; }
    .floaty:nth-child(9) { left: 51%; animation-duration: 12s; animation-delay: 4.5s; font-size: 18px; }
    .floaty:nth-child(10) { left: 57%; animation-duration: 15s; animation-delay: 2.5s; font-size: 24px; }
    .floaty:nth-child(11) { left: 63%; animation-duration: 11s; animation-delay: 6.5s; font-size: 16px; }
    .floaty:nth-child(12) { left: 69%; animation-duration: 17s; animation-delay: 3.5s; font-size: 22px; }
    .floaty:nth-child(13) { left: 75%; animation-duration: 13s; animation-delay: 0.8s; font-size: 19px; }
    .floaty:nth-child(14) { left: 81%; animation-duration: 16s; animation-delay: 5.5s; font-size: 25px; }
    .floaty:nth-child(15) { left: 87%; animation-duration: 12s; animation-delay: 7s; font-size: 18px; }
    .floaty:nth-child(16) { left: 93%; animation-duration: 15s; animation-delay: 2.8s; font-size: 23px; }
    .floaty:nth-child(17) { left: 6%; animation-duration: 18s; animation-delay: 8s; font-size: 20px; }
    .floaty:nth-child(18) { left: 18%; animation-duration: 14s; animation-delay: 9s; font-size: 17px; }
    .floaty:nth-child(19) { left: 30%; animation-duration: 19s; animation-delay: 10s; font-size: 23px; }
    .floaty:nth-child(20) { left: 42%; animation-duration: 16s; animation-delay: 11s; font-size: 18px; }
    .floaty:nth-child(21) { left: 54%; animation-duration: 18s; animation-delay: 8.5s; font-size: 24px; }
    .floaty:nth-child(22) { left: 66%; animation-duration: 14s; animation-delay: 9.5s; font-size: 17px; }
    .floaty:nth-child(23) { left: 78%; animation-duration: 19s; animation-delay: 10.5s; font-size: 22px; }
    .floaty:nth-child(24) { left: 90%; animation-duration: 16s; animation-delay: 11.5s; font-size: 19px; }

    @keyframes rise {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
      }
      8% {
        opacity: 0.28;
      }
      50% {
        transform: translateY(-55vh) translateX(12px) rotate(8deg);
        opacity: 0.24;
      }
      92% {
        opacity: 0.22;
      }
      100% {
        transform: translateY(-120vh) translateX(-12px) rotate(-8deg);
        opacity: 0;
      }
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 248, 242, 0.97);
      border-radius: 30px;
      padding: 32px 26px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      text-align: center;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(10px);
      animation: cardIn 0.9s ease 2.5s both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .tag {
      display: inline-block;
      padding: 10px 17px;
      border-radius: 999px;
      background: #ead2c4;
      color: #6d4638;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .tag span {
      font-size: 16px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 22px;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 500;
      color: #76645d;
    }

    #fact {
      font-size: 25px;
      line-height: 1.38;
      font-weight: 800;
      margin: 0 0 24px;
      color: #231f20;
    }

    button {
      border: none;
      background: #231f20;
      color: white;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      transition: 0.2s ease;
    }

    button:hover {
      transform: scale(1.02);
      opacity: 0.92;
    }

    .note {
      font-size: 13px;
      color: #8b7770;
      margin-top: 24px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div id="intro">
    <div class="intro-heart">❤️</div>
    <div class="intro-text">Good morning, my love</div>
  </div>

  <div class="sky">
    <span class="floaty">❤️</span>
    <span class="floaty">✨</span>
    <span class="floaty">❤️</span>
    <span class="floaty">⭐</span>
    <span class="floaty">❤️</span>
    <span class="floaty">✨</span>
    <span class="floaty">❤️</span>
    <span class="floaty">⭐</span>
    <span class="floaty">❤️</span>
    <span class="floaty">✨</span>
    <span class="floaty">❤️</span>
    <span class="floaty">⭐</span>
    <span class="floaty">❤️</span>
    <span class="floaty">✨</span>
    <span class="floaty">❤️</span>
    <span class="floaty">⭐</span>
    <span class="floaty">❤️</span>
    <span class="floaty">✨</span>
    <span class="floaty">❤️</span>
    <span class="floaty">⭐</span>
    <span class="floaty">❤️</span>
    <span class="floaty">✨</span>
    <span class="floaty">❤️</span>
    <span class="floaty">⭐</span>
  </div>

  <main class="card">
    <div class="tag">Daily lesson for my <span>habibi</span></div>

    <h1>Here is something you should know, my dear potential husband</h1>

    <p id="fact"></p>

    <button onclick="showRandomFact()">Show another one</button>

    <p class="note">Updated daily with love, so proud of you!</p>
  </main>

  <script>
    const facts = [
      "Never make her feel stupid for not knowing something. Teach gently or stay quiet.",
      "A real gentleman listens without planning his reply while she is still speaking.",
      "Good etiquette is not about looking rich. It is about making people feel comfortable around you.",
      "When walking with a woman, match her pace. Do not rush ahead and do not make her chase you.",
      "Compliment effort, not only appearance. Notice her hair, her dress, her energy, and her details.",
      "In a restaurant, be kind to the waiter. How you treat service staff says more than your outfit.",
      "If you invite someone out, have a plan. Time, place, booking, and transport should not be chaos.",
      "Do not embarrass your partner in public, even as a joke. Respect is part of attraction.",
      "A clean shirt, good shoes, fresh breath, and calm energy already put you ahead of most men.",
      "When she tells you something important, remember it. Love is often in the details.",
      "Being masculine does not mean being cold. Calm, protective, honest, and emotionally steady is stronger.",
      "Do not interrupt. Let people finish their sentence before you respond.",
      "If you make a mistake, say it clearly: I understand, I was wrong, I will fix it.",
      "Hold the door, but do not make a performance out of it. Good manners should feel natural.",
      "Confidence is quiet. Insecurity is loud.",
      "Flowers are not only for apologies. Give them on normal days too.",
      "A good man keeps his word, even in small things.",
      "Style is not about brands. Fit, cleanliness, and confidence matter more.",
      "A man who controls his tone during conflict is already ahead.",
      "Do not make her beg for reassurance. If you love her, say it clearly.",
      "Being busy is not an excuse to disappear. A short message is still effort.",
      "If she is upset, first try to understand before trying to defend yourself.",
      "Protect her peace, not just her safety.",
      "A mature man does not flirt for attention when he already has someone.",
      "If you say you will call, call. Small promises build big trust.",
      "Do not compare her to other women. Ever.",
      "A woman should feel emotionally safe with you, not confused by you.",
      "Respect is not only shown in public. It matters even more in private.",
      "A calm man makes the room feel safer.",
      "Do not raise your voice to win a conversation. Lower your ego instead.",
      "Remember important dates. Birthdays, plans, interviews, and little things matter.",
      "Support her dreams without making her feel like she has to choose between love and ambition.",
      "Being romantic is not cringe. Being careless is.",
      "If she had a hard day, ask what she needs: comfort, advice, food, or silence.",
      "Do not joke about her insecurities. That is not humor, that is damage.",
      "A man should know when to speak, when to listen, and when to apologize.",
      "Do not make loyalty look like a sacrifice. It should be normal.",
      "When you are wrong, do not turn the conversation into her reaction.",
      "Being gentle with the woman you love does not make you weak.",
      "If you love her, make her life softer, not heavier.",
      "A good partner notices when she is tired before she has to say it.",
      "Do not use silence as punishment. Communicate like an adult.",
      "The way you act when you are angry shows your real level of maturity.",
      "A man with discipline is more attractive than a man with excuses.",
      "Treat her with respect even when you disagree.",
      "If she tells you something hurt her, do not decide it should not have hurt.",
      "Be the man she can trust in a room full of people and in a room alone.",
      "Good manners are not old-fashioned. They are timeless.",
      "A serious man does not make the woman he loves feel optional.",
      "When she is speaking, put your phone down.",
      "Do not let pride ruin a good relationship.",
      "Speak well of her when she is not in the room.",
      "A man who can apologize without being forced is rare.",
      "Consistency is more romantic than big words.",
      "The right woman should feel chosen, not tolerated.",
      "Learn to be emotionally honest without being emotionally messy.",
      "Do not confuse dominance with disrespect.",
      "Be soft with her heart and strong with your character.",
      "If you want a high-value woman, become a high-effort man.",
      "Small daily kindness matters more than one dramatic gesture.",
      "The best kind of love feels peaceful, not confusing.",
      "Make her laugh, but never make her the joke.",
      "A man’s reputation is built by how he behaves when nobody is watching.",
      "Do not act single when you are loved.",
      "A real man can be corrected without feeling attacked.",
      "Being protective means creating safety, not control.",
      "A woman remembers how you made her feel during small moments.",
      "Never make her feel alone while she is in a relationship with you.",
      "Gentle words can fix what pride would destroy.",
      "If she is important to you, your actions should make that obvious.",
      "Good love is not about perfection. It is about effort, respect, and consistency.",
      "Be the reason she feels calm, not the reason she overthinks."
    ];

    function getDailyIndex() {
      const start = new Date(new Date().getFullYear(), 0, 0);
      const today = new Date();
      const diff = today - start;
      const oneDay = 1000 * 60 * 60 * 24;
      return Math.floor(diff / oneDay) % facts.length;
    }

    function showDailyFact() {
      document.getElementById("fact").innerText = facts[getDailyIndex()];
    }

    function showRandomFact() {
      const randomIndex = Math.floor(Math.random() * facts.length);
      document.getElementById("fact").innerText = facts[randomIndex];
    }

    showDailyFact();

    setTimeout(() => {
      const intro = document.getElementById("intro");
      if (intro) {
        intro.style.display = "none";
      }
    }, 3000);
  </script>
</body>
</html>
